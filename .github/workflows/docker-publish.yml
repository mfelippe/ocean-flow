name: Publicar e fazer deploy

# Publica em ghcr.io ao criar uma tag de versão (ex.: v0.2.0) ou manualmente.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Fazer deploy no VPS após build?"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Build + push da imagem Docker ────────────────────────────────────────
  build-and-push:
    name: Build & Push imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Necessário para o cache GHA (type=gha): o driver docker padrão não
      # suporta exportar cache; o buildx (docker-container) suporta.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy no VPS via SSH ────────────────────────────────────────────────
  deploy:
    name: Deploy no VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Deploy via SSH é OPT-IN: só roda se a variável de repositório
    # ENABLE_VPS_DEPLOY = "true" (Settings → Variables). Quem usa Coolify ou
    # outro mecanismo (deploy no push) deixa desativado — a tag apenas publica
    # a imagem no GHCR, sem SSH inesperado.
    if: |
      vars.ENABLE_VPS_DEPLOY == 'true' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    # Protege o ambiente de produção (opcional: configure em Settings → Environments)
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/ocean-flow

            echo "→ Autenticando no GHCR…"
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "→ Baixando nova imagem (latest)…"
            docker compose pull app

            echo "→ Reiniciando com zero downtime…"
            docker compose up -d --remove-orphans

            echo "→ Aguardando healthcheck…"
            timeout 90 bash -c \
              'until docker compose exec -T app wget -qO- http://localhost:3000/api/health; do sleep 3; done'

            echo "→ Limpando imagens antigas…"
            docker image prune -f

            echo "✓ Deploy concluído — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
