# Compose de produção: usa a imagem publicada (sem build local).
#
#   1. Crie um arquivo .env ao lado deste com, no mínimo:
#        AUTH_SECRET=<openssl rand -base64 32>
#        AUTH_URL=https://kanban.seu-dominio.com
#   2. docker compose -f docker-compose.release.yml up -d
#
# Banco: por padrão usa o PostgreSQL embutido (serviço `db`, não exposto).
# Para usar um Postgres EXTERNO, defina DATABASE_URL no .env apontando para ele
# (a URL precisa ser postgresql://...; o app valida e falha cedo se não for).
# Veja docs/SELF-HOSTING.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oceanflow
      POSTGRES_PASSWORD: oceanflow # interno: o serviço não expõe a porta 5432
      POSTGRES_DB: oceanflow
    volumes:
      - oceanflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/mfelippe/ocean-flow:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://oceanflow:oceanflow@db:5432/oceanflow?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: "production"
      UPLOAD_DIR: "/data/uploads"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - oceanflow_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  oceanflow_db:
  oceanflow_uploads:
