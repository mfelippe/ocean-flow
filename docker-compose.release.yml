# Compose de produção: usa a imagem publicada (sem build local).
#
#   1. Crie um arquivo .env ao lado deste com, no mínimo:
#        AUTH_SECRET=<openssl rand -base64 32>
#        AUTH_URL=https://kanban.seu-dominio.com
#        POSTGRES_PASSWORD=<senha forte>
#   2. docker compose -f docker-compose.release.yml up -d
#
# Veja docs/SELF-HOSTING.md para detalhes (upgrade, backup, etc.).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oceanflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: oceanflow
    volumes:
      - oceanflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/mfelippe/ocean-flow:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://oceanflow:${POSTGRES_PASSWORD}@db:5432/oceanflow?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: "production"
      UPLOAD_DIR: "/data/uploads"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - oceanflow_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  oceanflow_db:
  oceanflow_uploads:
